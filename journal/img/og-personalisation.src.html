<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;800&family=Caveat:wght@700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#f1ece1;position:relative;overflow:hidden;font-family:'Inter Tight',Arial,sans-serif;color:#141310}
.copy{position:absolute;left:68px;top:70px;width:600px}
h1{font-weight:800;font-size:92px;line-height:.98;letter-spacing:-.035em}
h1 .q{white-space:nowrap}
.sub{font-size:30px;line-height:1.3;font-weight:500;margin-top:30px;color:#3a362d;max-width:520px}
.foot{position:absolute;left:68px;bottom:54px;right:68px;display:flex;align-items:center;gap:22px}
.pill{background:#141310;color:#f1ece1;font-weight:800;font-size:26px;padding:16px 30px;border-radius:99px}
.url{font:500 20px 'JetBrains Mono',monospace;color:#6a6454}
.mail{position:absolute;right:70px;top:78px;width:410px;background:#fff;border-radius:10px;box-shadow:0 2px 0 #0001,0 30px 50px -24px #2a2415aa;transform:rotate(2.2deg);overflow:hidden}
.bar{padding:16px 22px;border-bottom:1px solid #eceae4;font:500 15px 'JetBrains Mono',monospace;color:#85806f}
.bar b{color:#141310}
.body{padding:30px 28px 34px;font-size:27px;line-height:1.45;color:#26231c}
.body .hi{font-weight:800;font-size:34px;position:relative;display:inline-block}
.body p{margin-top:18px;color:#5a5546;font-size:23px}
.btn{display:inline-block;margin-top:24px;background:#17b26a;color:#fff;font-weight:800;font-size:21px;padding:13px 28px;border-radius:99px}
svg.circle{position:absolute;left:-18px;top:-14px;overflow:visible}
.note{position:absolute;font:700 40px 'Caveat',cursive;color:#d62d20;line-height:1}
</style></head><body>
<div class="copy">
  <h1>Ever got an email that says <span class="q">“Hi ,”?</span></h1>
  <p class="sub">Why it happens, and how to stop sending them.</p>
</div>
<div class="mail">
  <div class="bar"><b>From:</b> A shop you bought from once</div>
  <div class="body">
    <span class="hi">Hi &nbsp;&nbsp;,
      <svg class="circle" width="150" height="64" viewBox="0 0 150 64"><path d="M20 10 C60 -4 128 6 138 30 C146 54 70 66 28 54 C-6 44 -2 14 40 6" fill="none" stroke="#d62d20" stroke-width="4.5" stroke-linecap="round"/></svg>
    </span>
    <p>Your basket is waiting. Don't miss out on your order!</p>
    <span class="btn">Complete order</span>
  </div>
</div>
<div class="note" style="right:110px;top:470px;font-size:46px;transform:rotate(-3deg)">&uarr; where's my name??</div>
<div class="foot"><span class="pill">Read the post →</span></div>
</body></html>
