<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;800&family=Caveat:wght@700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#f1ece1;position:relative;overflow:hidden;font-family:'Inter Tight',Arial,sans-serif;color:#141310}
.copy{position:absolute;left:68px;top:70px;width:620px}
h1{font-weight:800;font-size:88px;line-height:.98;letter-spacing:-.035em}
.sub{font-size:30px;line-height:1.3;font-weight:500;margin-top:30px;color:#3a362d;max-width:540px}
.foot{position:absolute;left:68px;bottom:54px;right:68px;display:flex;align-items:center;gap:22px}
.pill{background:#141310;color:#f1ece1;font-weight:800;font-size:26px;padding:16px 30px;border-radius:99px}
.url{font:500 20px 'JetBrains Mono',monospace;color:#6a6454}
.mail{position:absolute;right:84px;top:-30px;width:380px;height:610px;overflow:hidden;border-radius:10px;box-shadow:0 2px 0 #0001,0 30px 50px -24px #2a2415aa;transform:rotate(2deg);background:#fff}
.mail img{display:block;width:100%}
.note{position:absolute;font:700 40px 'Caveat',cursive;color:#d62d20;line-height:1}
svg{position:absolute;overflow:visible}
</style></head><body>
<div class="copy">
  <h1>Can you select the headline in your email?</h1>
  <p class="sub">If not, you're sending a picture. Here's what that costs.</p>
</div>
<div class="mail"><img src="email-live-1.jpg"></div>
<svg style="right:96px;top:26px" width="360" height="124" viewBox="0 0 330 116"><path d="M30 24 C100 -6 290 4 318 42 C340 84 190 116 60 98 C-8 86 -6 34 56 18" fill="none" stroke="#d62d20" stroke-width="5" stroke-linecap="round"/></svg>
<div class="note" style="right:48px;top:158px;transform:rotate(-6deg)">text or<br>a picture?</div>
<div class="foot"><span class="pill">Read the post →</span></div>
</body></html>
